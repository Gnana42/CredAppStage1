trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: BuildandScan
    displayName: Build docker images and scan with Trivy
    jobs:
      - job: 
        displayName: Build docker images and scan with Trivy
        
        steps:
          - checkout: self

          - script: |
              docker build -t frontend:$(Build.BuildID) ./frontend-react
              docker build -t user-service:$(Build.BuildID) ./user-service
              docker build -t payment-service:$(Build.BuildID) ./payment-service

              docker images
            displayName: Building docker images

          - script: |
              set -e
              sudo apt-get update
              sudo apt-get install -y \
                wget \
                gnupg \
                lsb-release \
                apt-transport-https
              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
              gpg --dearmor | \
              sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
              echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
              sudo tee /etc/apt/sources.list.d/trivy.list
              sudo apt-get update
              sudo apt-get install -y trivy

              trivy --version
              mkdir -p reports
              wget https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -O reports/html.tpl
            displayName: Trivy Installation

          - script: |
              trivy image frontend:$(Build.BuildID) --severity HIGH,CRITICAL --format template --template "@reports/heml.tpl" -o reports/frontend-reports.html
              trivy image frontend:$(Build.BuildID) --severity HIGH,CRITICAL --format json -o reports/frontend-reports.json
              trivy image user-service:$(Build.BuildID) --severity HIGH,CRITICAL --format template --template "@reports/heml.tpl" -o reports/user-service-reports.html
              trivy image user-service:$(Build.BuildID) --severity HIGH,CRITICAL --format json -o reports/user-service-reports.json
              trivy image payment-service:$(Build.BuildID) --severity HIGH,CRITICAL --format template --template "@reports/heml.tpl" -o reports/payment-service-reports.html
              trivy image payment-service:$(Build.BuildID) --severity HIGH,CRITICAL --format json -o reports/payment-service-reports.json
            displayName: Scan the images

          - task: PublishBuildArtifacts@1
            displayName: Publish Trivy reports
            inputs:
              PathtoPublish: reports
              ArtifactName: TrivyReports
              publishLocation: Container